<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Spese Casa</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      opacity: .75;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .user-greeting {
      margin-top: 14px;
      font-size: 17px;
      font-weight: bold;
    }

    .logout-button {
      background: #374151;
      color: white;
      padding: 9px 13px;
      font-size: 14px;
      white-space: nowrap;
    }

    .logout-button:hover {
      background: #4b5563;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .summary-box {
      background: #f9fafb;
      border-radius: 14px;
      padding: 15px;
    }

    .summary-box strong {
      display: block;
      font-size: 21px;
      margin-top: 5px;
    }

    /* =========================
       CONGUAGLIO
    ========================= */

    .settlement {
      background: #f9fafb;
      border-radius: 14px;
      padding: 18px;
    }

    .settlement-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .settlement-result {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
    }

    .settlement-detail {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
    }

    .settlement-positive {
      color: #166534;
    }

    .settlement-negative {
      color: #991b1b;
    }

    .settlement-equal {
      color: #166534;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      background: #111827;
      color: white;
      font-weight: bold;
    }

    .expense {
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 0;
    }

    .expense:last-child {
      border-bottom: 0;
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .expense-description {
      font-weight: bold;
    }

    .expense-amount {
      font-weight: bold;
      white-space: nowrap;
    }

    .expense-info {
      margin-top: 5px;
      color: #6b7280;
      font-size: 14px;
    }

    .expense-category {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
      font-weight: bold;
    }

    .attachment {
      display: inline-block;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      background: #eef2ff;
      color: #3730a3;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 25px 10px;
    }

    #appContent {
      display: none;
    }

    #loginBox {
      display: none;
    }

    .error {
      color: #b91c1c;
      margin-top: 10px;
    }

    .file-label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .file-info {
      font-size: 14px;
      color: #6b7280;
      margin-top: 5px;
    }

    @media (max-width: 480px) {
      .header-top {
        align-items: flex-start;
      }

      .logout-button {
        padding: 8px 10px;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <div class="header-top">

      <div>
        <h1>🏠 Spese Casa</h1>
        <p>usi & enz</p>
      </div>

      <button
        class="logout-button"
        onclick="logout()"
      >
        🚪 Esci
      </button>

    </div>

    <div
      id="userGreeting"
      class="user-greeting"
    >
      👋 Ciao
    </div>

  </header>


  <!-- LOGIN -->

  <div class="card" id="loginBox">

    <h2>Accedi</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Accedi
    </button>

    <div
      id="loginError"
      class="error"
    ></div>

  </div>


  <!-- APP -->

  <div id="appContent">

    <!-- =========================
         RIEPILOGO
    ========================= -->

    <div class="card">

      <div class="summary">

        <div class="summary-box">
          Totale casa
          <strong id="total">€ 0,00</strong>
        </div>

        <div class="summary-box">
          Saldo
          <strong id="balance">€ 0,00</strong>
        </div>

        <div class="summary-box">
          usi
          <strong id="usiTotal">€ 0,00</strong>
        </div>

        <div class="summary-box">
          enz
          <strong id="enzTotal">€ 0,00</strong>
        </div>

      </div>

    </div>


    <!-- =========================
         CHI DEVE QUANTO
    ========================= -->

    <div class="card">

      <div class="settlement">

        <div class="settlement-title">
          💰 Chi deve quanto?
        </div>

        <div
          id="settlementResult"
          class="settlement-result"
        >
          Siete in pari ✅
        </div>

        <div
          id="settlementDetail"
          class="settlement-detail"
        >
          La spesa viene divisa al 50%.
        </div>

      </div>

    </div>


    <!-- =========================
         AGGIUNGI SPESA
    ========================= -->

    <div class="card">

      <h2>Aggiungi spesa</h2>

      <input
        id="description"
        type="text"
        placeholder="Descrizione"
      >

      <input
        id="amount"
        type="number"
        step="0.01"
        placeholder="Importo €"
      >


      <!-- CATEGORIA -->

      <select id="category">

        <option value="">
          Seleziona categoria
        </option>

      </select>


      <!-- CHI HA PAGATO -->

      <select id="paidBy">

        <option value="">
          Chi ha pagato?
        </option>

      </select>


      <!-- ALLEGATO -->

      <label
        class="file-label"
        for="attachment"
      >
        📎 Scontrino / documento
      </label>

      <input
        id="attachment"
        type="file"
        accept="image/jpeg,image/png,application/pdf"
      >

      <div class="file-info">
        Puoi allegare una foto JPG/PNG oppure un PDF,
        massimo 10 MB.
      </div>


      <button
        class="primary"
        style="margin-top:12px;"
        onclick="addExpense()"
      >
        ＋ Salva spesa
      </button>

      <div
        id="expenseError"
        class="error"
      ></div>

    </div>


    <!-- =========================
         ULTIME SPESE
    ========================= -->

    <div class="card">

      <h2>Ultime spese</h2>

      <div
        id="expensesList"
        class="empty"
      >
        Caricamento...
      </div>

    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://ypjpdqxnlqecoqxdncwe.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_wnJn6MNhPSQ-Q-VpG6Dq-A_bbqaQbhu";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     COSTANTI
  ========================= */

  const HOUSEHOLD_ID =
    "68c527c5-6ff5-4df8-9fa2-5ddaec4cdb8a";

  const STORAGE_BUCKET =
    "Allegati";

  const MAX_FILE_SIZE =
    10 * 1024 * 1024;

  const ALLOWED_TYPES = [
    "image/jpeg",
    "image/png",
    "application/pdf"
  ];


  let currentUser = null;
  let members = [];
  let categories = [];


  /* =========================
     AVVIO APP
  ========================= */

  async function startApp() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (!data.session) {

      document.getElementById(
        "loginBox"
      ).style.display = "block";

      document.getElementById(
        "appContent"
      ).style.display = "none";

      document.querySelector(
        ".logout-button"
      ).style.display = "none";

      document.getElementById(
        "userGreeting"
      ).style.display = "none";

      return;
    }

    currentUser =
      data.session.user;

    document.getElementById(
      "loginBox"
    ).style.display = "none";

    document.getElementById(
      "appContent"
    ).style.display = "block";

    document.querySelector(
      ".logout-button"
    ).style.display = "block";

    document.getElementById(
      "userGreeting"
    ).style.display = "block";


    await loadUserGreeting();

    await loadMembers();

    await loadCategories();

    await loadExpenses();
  }


  /* =========================
     LOGIN
  ========================= */

  async function login() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      document.getElementById(
        "loginError"
      ).textContent =
        error.message;

      return;
    }


    location.reload();
  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    const conferma =
      confirm(
        "Sei sicuro di voler uscire?"
      );

    if (!conferma) {
      return;
    }


    const { error } =
      await supabaseClient.auth.signOut();


    if (error) {

      alert(
        "Errore durante il logout: " +
        error.message
      );

      return;
    }


    currentUser = null;

    location.reload();
  }


  /* =========================
     SALUTO UTENTE
  ========================= */

  async function loadUserGreeting() {

    const greeting =
      document.getElementById(
        "userGreeting"
      );


    let displayName = "";


    const { data, error } =
      await supabaseClient
        .from("household_members")
        .select("display_name")
        .eq(
          "household_id",
          HOUSEHOLD_ID
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();


    if (
      !error &&
      data &&
      data.display_name
    ) {

      displayName =
        data.display_name;
    }


    if (!displayName) {

      const email =
        currentUser.email || "";

      displayName =
        email.split("@")[0];
    }


    displayName =
      displayName.trim();


    if (displayName) {

      displayName =
        displayName.charAt(0).toUpperCase() +
        displayName.slice(1);
    }


    greeting.textContent =
      "👋 Ciao " +
      displayName;
  }


  /* =========================
     CARICA MEMBRI
  ========================= */

  async function loadMembers() {

    const { data, error } =
      await supabaseClient
        .from("household_members")
        .select(
          "user_id, display_name"
        )
        .eq(
          "household_id",
          HOUSEHOLD_ID
        );


    if (error) {

      console.error(error);

      return;
    }


    members =
      data || [];


    const select =
      document.getElementById(
        "paidBy"
      );


    select.innerHTML =
      '<option value="">Chi ha pagato?</option>';


    members.forEach(member => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        member.user_id;

      option.textContent =
        member.display_name;

      select.appendChild(option);

    });
  }


  /* =========================
     CARICA CATEGORIE
  ========================= */

  async function loadCategories() {

    const { data, error } =
      await supabaseClient
        .from("categories")
        .select(
          "id, name"
        )
        .eq(
          "household_id",
          HOUSEHOLD_ID
        )
        .order(
          "name",
          { ascending: true }
        );


    if (error) {

      console.error(
        "Errore categorie:",
        error
      );

      document.getElementById(
        "expenseError"
      ).textContent =
        "Errore nel caricamento delle categorie: " +
        error.message;

      return;
    }


    categories =
      data || [];


    const select =
      document.getElementById(
        "category"
      );


    select.innerHTML =
      '<option value="">Seleziona categoria</option>';


    categories.forEach(category => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        category.id;

      option.textContent =
        category.name;

      select.appendChild(option);

    });
  }


  /* =========================
     CARICA SPESE
  ========================= */

  async function loadExpenses() {

    const { data, error } =
      await supabaseClient
        .from("expenses")
        .select(`
          id,
          household_id,
          paid_by,
          category_id,
          amount,
          description,
          expense_date,

          categories (
            id,
            name
          ),

          expense_attachments (
            id,
            file_name,
            file_path,
            file_type
          )
        `)
        .eq(
          "household_id",
          HOUSEHOLD_ID
        )
        .order(
          "expense_date",
          { ascending: false }
        );


    if (error) {

      console.error(error);

      document.getElementById(
        "expensesList"
      ).textContent =
        "Errore nel caricamento delle spese.";

      return;
    }


    const expenses =
      data || [];


    let total = 0;
    let usi = 0;
    let enz = 0;


    const list =
      document.getElementById(
        "expensesList"
      );


    if (expenses.length === 0) {

      list.innerHTML =
        '<div class="empty">Nessuna spesa ancora inserita.</div>';

    } else {

      list.innerHTML = "";


      for (const expense of expenses) {

        const amount =
          Number(expense.amount) || 0;


        total += amount;


        const member =
          members.find(
            m =>
              m.user_id ===
              expense.paid_by
          );


        const name =
          member
            ? member.display_name
            : "Utente";


        if (
          name.toLowerCase() ===
          "usi"
        ) {
          usi += amount;
        }


        if (
          name.toLowerCase() ===
          "enz"
        ) {
          enz += amount;
        }


        const div =
          document.createElement(
            "div"
          );

        div.className =
          "expense";


        /* =========================
           CATEGORIA
        ========================= */

        let categoryHtml = "";

        if (
          expense.categories &&
          expense.categories.name
        ) {

          categoryHtml = `
            <div class="expense-category">
              🏷️
              ${escapeHtml(
                expense.categories.name
              )}
            </div>
          `;
        }


        /* =========================
           ALLEGATO
        ========================= */

        let attachmentHtml = "";


        const attachments =
          expense.expense_attachments ||
          [];


        if (attachments.length > 0) {

          const attachment =
            attachments[0];


          const {
            data: signedData,
            error: signedError
          } =
            await supabaseClient.storage
              .from(
                STORAGE_BUCKET
              )
              .createSignedUrl(
                attachment.file_path,
                3600
              );


          if (
            !signedError &&
            signedData?.signedUrl
          ) {

            const icon =
              attachment.file_type ===
              "application/pdf"
                ? "📄"
                : "📷";


            attachmentHtml = `
              <a
                class="attachment"
                href="${signedData.signedUrl}"
                target="_blank"
                rel="noopener"
              >
                ${icon}
                ${escapeHtml(
                  attachment.file_name
                )}
              </a>
            `;
          }
        }


        /* =========================
           HTML SPESA
        ========================= */

        div.innerHTML = `

          <div class="expense-top">

            <div class="expense-description">
              ${escapeHtml(
                expense.description ||
                "Spesa"
              )}
            </div>

            <div class="expense-amount">
              € ${amount.toFixed(2)}
            </div>

          </div>


          ${categoryHtml}


          <div class="expense-info">
            Pagata da
            ${escapeHtml(name)}
            ·
            ${escapeHtml(
              expense.expense_date
            )}
          </div>


          ${attachmentHtml}


          <button
            onclick="deleteExpense('${expense.id}')"
            style="
              margin-top:10px;
              background:#fee2e2;
              color:#991b1b;
            "
          >
            🗑️ Elimina
          </button>

        `;


        list.appendChild(div);
      }
    }


    /* =========================
       TOTALI
    ========================= */

    document.getElementById(
      "total"
    ).textContent =
      formatEuro(total);


    document.getElementById(
      "usiTotal"
    ).textContent =
      formatEuro(usi);


    document.getElementById(
      "enzTotal"
    ).textContent =
      formatEuro(enz);


    /*
      Saldo attuale:
      positivo = Usi ha pagato di più
      negativo = Enz ha pagato di più
    */

    const balance =
      usi - enz;


    document.getElementById(
      "balance"
    ).textContent =
      formatEuro(balance);


    /* =========================
       CONGUAGLIO 50/50
    ========================= */

    updateSettlement(
      total,
      usi,
      enz
    );
  }


  /* =========================
     CALCOLO CHI DEVE QUANTO
  ========================= */

  function updateSettlement(
    total,
    usi,
    enz
  ) {

    const result =
      document.getElementById(
        "settlementResult"
      );

    const detail =
      document.getElementById(
        "settlementDetail"
      );


    /*
      Ogni persona dovrebbe
      sostenere metà del totale.
    */

    const quota =
      total / 2;


    /*
      Differenza rispetto
      alla quota corretta.
    */

    const usiDifference =
      usi - quota;

    const enzDifference =
      enz - quota;


    /*
      Piccola tolleranza per
      evitare problemi con i decimali.
    */

    const tolerance =
      0.01;


    /* =========================
       SONO IN PARI
    ========================= */

    if (
      Math.abs(usiDifference) <= tolerance &&
      Math.abs(enzDifference) <= tolerance
    ) {

      result.textContent =
        "Siete in pari ✅";

      result.className =
        "settlement-result settlement-equal";

      detail.textContent =
        "Avete pagato entrambi la vostra quota.";

      return;
    }


    /* =========================
       ENZ DEVE A USI
    ========================= */

    if (
      usi > enz
    ) {

      const amountOwed =
        (usi - enz) / 2;


      result.textContent =
        "💸 Enz deve a Usi " +
        formatEuro(amountOwed);


      result.className =
        "settlement-result settlement-positive";


      detail.textContent =
        "Per dividere le spese al 50%, ciascuno dovrebbe sostenere " +
        formatEuro(quota) +
        ".";

      return;
    }


    /* =========================
       USI DEVE A ENZ
    ========================= */

    if (
      enz > usi
    ) {

      const amountOwed =
        (enz - usi) / 2;


      result.textContent =
        "💸 Usi deve a Enz " +
        formatEuro(amountOwed);


      result.className =
        "settlement-result settlement-negative";


      detail.textContent =
        "Per dividere le spese al 50%, ciascuno dovrebbe sostenere " +
        formatEuro(quota) +
        ".";

      return;
    }


    /*
      Caso di sicurezza.
    */

    result.textContent =
      "Siete in pari ✅";

    result.className =
      "settlement-result settlement-equal";

    detail.textContent =
      "Non c'è nessun conguaglio.";
  }


  /* =========================
     ELIMINA SPESA
  ========================= */

  async function deleteExpense(id) {

    const conferma =
      confirm(
        "Sei sicuro di voler eliminare questa spesa?"
      );


    if (!conferma) {
      return;
    }


    /* Recuperiamo eventuali allegati */

    const {
      data: attachments,
      error: attachmentReadError
    } =
      await supabaseClient
        .from(
          "expense_attachments"
        )
        .select(
          "id, file_path"
        )
        .eq(
          "expense_id",
          id
        );


    if (attachmentReadError) {

      alert(
        "Errore nel recupero dell'allegato: " +
        attachmentReadError.message
      );

      return;
    }


    /* Eliminiamo i file dallo Storage */

    if (
      attachments &&
      attachments.length > 0
    ) {

      const paths =
        attachments.map(
          a => a.file_path
        );


      const {
        error: storageError
      } =
        await supabaseClient.storage
          .from(
            STORAGE_BUCKET
          )
          .remove(paths);


      if (storageError) {

        alert(
          "Errore nell'eliminazione dell'allegato: " +
          storageError.message
        );

        return;
      }
    }


    /* Eliminiamo il collegamento */

    const {
      error: attachmentDeleteError
    } =
      await supabaseClient
        .from(
          "expense_attachments"
        )
        .delete()
        .eq(
          "expense_id",
          id
        );


    if (attachmentDeleteError) {

      alert(
        "Errore nell'eliminazione del documento: " +
        attachmentDeleteError.message
      );

      return;
    }


    /* Eliminiamo la spesa */

    const { error } =
      await supabaseClient
        .from("expenses")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "Errore durante l'eliminazione: " +
        error.message
      );

      return;
    }


    await loadExpenses();
  }


  /* =========================
     AGGIUNGI SPESA
  ========================= */

  async function addExpense() {

    const description =
      document.getElementById(
        "description"
      ).value.trim();


    const amount =
      Number(
        document.getElementById(
          "amount"
        ).value
      );


    const paidBy =
      document.getElementById(
        "paidBy"
      ).value;


    const categoryId =
      document.getElementById(
        "category"
      ).value;


    const fileInput =
      document.getElementById(
        "attachment"
      );


    const file =
      fileInput.files[0];


    const errorBox =
      document.getElementById(
        "expenseError"
      );


    errorBox.textContent = "";


    /* Descrizione */

    if (!description) {

      errorBox.textContent =
        "Inserisci una descrizione.";

      return;
    }


    /* Importo */

    if (
      !amount ||
      amount <= 0
    ) {

      errorBox.textContent =
        "Inserisci un importo valido.";

      return;
    }


    /* Categoria */

    if (!categoryId) {

      errorBox.textContent =
        "Seleziona una categoria.";

      return;
    }


    /* Pagante */

    if (!paidBy) {

      errorBox.textContent =
        "Seleziona chi ha pagato.";

      return;
    }


    /* Allegato */

    if (file) {

      if (
        file.size >
        MAX_FILE_SIZE
      ) {

        errorBox.textContent =
          "Il file è troppo grande. Massimo 10 MB.";

        return;
      }


      if (
        !ALLOWED_TYPES.includes(
          file.type
        )
      ) {

        errorBox.textContent =
          "Formato non valido. Usa JPG, PNG oppure PDF.";

        return;
      }
    }


    /* =========================
       1. CREA SPESA
    ========================= */

    const {
      data: expense,
      error
    } =
      await supabaseClient
        .from("expenses")
        .insert({

          household_id:
            HOUSEHOLD_ID,

          paid_by:
            paidBy,

          category_id:
            categoryId,

          amount:
            amount,

          description:
            description,

          expense_date:
            new Date()
              .toISOString()
              .split("T")[0]

        })
        .select()
        .single();


    if (error) {

      console.error(error);

      errorBox.textContent =
        "Errore nel salvataggio: " +
        error.message;

      return;
    }


    /* =========================
       2. CARICA ALLEGATO
    ========================= */

    if (file) {

      const safeFileName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const filePath =
        HOUSEHOLD_ID +
        "/" +
        expense.id +
        "/" +
        Date.now() +
        "_" +
        safeFileName;


      const {
        error: uploadError
      } =
        await supabaseClient.storage
          .from(
            STORAGE_BUCKET
          )
          .upload(
            filePath,
            file,
            {
              cacheControl:
                "3600",

              upsert:
                false,

              contentType:
                file.type
            }
          );


      if (uploadError) {

        console.error(
          uploadError
        );


        /* Pulizia della spesa */

        await supabaseClient
          .from("expenses")
          .delete()
          .eq(
            "id",
            expense.id
          );


        errorBox.textContent =
          "Errore nel caricamento dell'allegato: " +
          uploadError.message;

        return;
      }


      /* =========================
         3. REGISTRA ALLEGATO
      ========================= */

      const {
        error: attachmentError
      } =
        await supabaseClient
          .from(
            "expense_attachments"
          )
          .insert({

            expense_id:
              expense.id,

            file_name:
              file.name,

            file_path:
              filePath,

            file_type:
              file.type,

            file_size:
              file.size

          });


      if (attachmentError) {

        console.error(
          attachmentError
        );


        /* Elimina file */

        await supabaseClient.storage
          .from(
            STORAGE_BUCKET
          )
          .remove([
            filePath
          ]);


        /* Elimina spesa */

        await supabaseClient
          .from("expenses")
          .delete()
          .eq(
            "id",
            expense.id
          );


        errorBox.textContent =
          "Errore nel salvataggio dell'allegato: " +
          attachmentError.message;

        return;
      }
    }


    /* =========================
       PULIZIA FORM
    ========================= */

    document.getElementById(
      "description"
    ).value = "";


    document.getElementById(
      "amount"
    ).value = "";


    document.getElementById(
      "category"
    ).value = "";


    document.getElementById(
      "paidBy"
    ).value = "";


    document.getElementById(
      "attachment"
    ).value = "";


    await loadExpenses();
  }


  /* =========================
     FORMATO EURO
  ========================= */

  function formatEuro(value) {

    return new Intl.NumberFormat(
      "it-IT",
      {
        style: "currency",
        currency: "EUR"
      }
    ).format(value);
  }


  /* =========================
     SICUREZZA HTML
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }


  /* =========================
     AVVIO
  ========================= */

  startApp();

</script>

</body>
</html>
