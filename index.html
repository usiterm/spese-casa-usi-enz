<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Spese Casa</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      opacity: .75;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .summary-box {
      background: #f9fafb;
      border-radius: 14px;
      padding: 15px;
    }

    .summary-box strong {
      display: block;
      font-size: 21px;
      margin-top: 5px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      background: #111827;
      color: white;
      font-weight: bold;
    }

    .expense {
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 0;
    }

    .expense:last-child {
      border-bottom: 0;
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .expense-description {
      font-weight: bold;
    }

    .expense-amount {
      font-weight: bold;
    }

    .expense-info {
      margin-top: 5px;
      color: #6b7280;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 25px 10px;
    }

    #appContent {
      display: none;
    }

    #loginBox {
      display: none;
    }

    .error {
      color: #b91c1c;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🏠 Spese Casa</h1>
    <p>usi & enz</p>
  </header>

  <div class="card" id="loginBox">
    <h2>Accedi</h2>

    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Password">

    <button class="primary" onclick="login()">
      Accedi
    </button>

    <div id="loginError" class="error"></div>
  </div>

  <div id="appContent">

    <div class="card">
      <div class="summary">

        <div class="summary-box">
          Totale casa
          <strong id="total">€ 0,00</strong>
        </div>

        <div class="summary-box">
          Saldo
          <strong id="balance">€ 0,00</strong>
        </div>

        <div class="summary-box">
          usi
          <strong id="usiTotal">€ 0,00</strong>
        </div>

        <div class="summary-box">
          enz
          <strong id="enzTotal">€ 0,00</strong>
        </div>

      </div>
    </div>

    <div class="card">
      <h2>Aggiungi spesa</h2>

      <input id="description" type="text" placeholder="Descrizione">

      <input id="amount" type="number" step="0.01" placeholder="Importo €">

      <select id="paidBy">
        <option value="">Chi ha pagato?</option>
      </select>

      <button class="primary" onclick="addExpense()">
        ＋ Salva spesa
      </button>

      <div id="expenseError" class="error"></div>
    </div>

    <div class="card">
      <h2>Ultime spese</h2>

      <div id="expensesList" class="empty">
        Caricamento...
      </div>
    </div>

  </div>

</div>

<script>
  const SUPABASE_URL =
    "https://ypjpdqxnlqecoqxdncwe.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_wnJn6MNhPSQ-Q-VpG6Dq-A_bbqaQbhu";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const HOUSEHOLD_ID =
    "68c527c5-6ff5-4df8-9fa2-5ddaec4cdb8a";

  let currentUser = null;
  let members = [];

  async function startApp() {

    const { data } = await supabaseClient.auth.getSession();

    if (!data.session) {
      document.getElementById("loginBox").style.display = "block";
      return;
    }

    currentUser = data.session.user;

    document.getElementById("appContent").style.display = "block";

    await loadMembers();
    await loadExpenses();
  }

  async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      document.getElementById("loginError").textContent =
        error.message;
      return;
    }

    location.reload();
  }

  async function loadMembers() {

    const { data, error } = await supabaseClient
      .from("household_members")
      .select("user_id, display_name")
      .eq("household_id", HOUSEHOLD_ID);

    if (error) {
      console.error(error);
      return;
    }

    members = data || [];

    const select = document.getElementById("paidBy");

    members.forEach(member => {
      const option = document.createElement("option");

      option.value = member.user_id;
      option.textContent = member.display_name;

      select.appendChild(option);
    });
  }

  async function loadExpenses() {

    const { data, error } = await supabaseClient
      .from("expenses")
      .select("id, household_id, paid_by, amount, description, expense_date")
      .eq("household_id", HOUSEHOLD_ID)
      .order("expense_date", { ascending: false });

    if (error) {
      console.error(error);

      document.getElementById("expensesList").textContent =
        "Errore nel caricamento delle spese.";

      return;
    }

    const expenses = data || [];

    let total = 0;
    let usi = 0;
    let enz = 0;

    const list = document.getElementById("expensesList");

    if (expenses.length === 0) {
      list.innerHTML =
        '<div class="empty">Nessuna spesa ancora inserita.</div>';
    } else {

      list.innerHTML = "";

      expenses.forEach(expense => {

        const amount = Number(expense.amount) || 0;
        total += amount;

        const member = members.find(
          m => m.user_id === expense.paid_by
        );

        const name = member ? member.display_name : "Utente";

        if (name.toLowerCase() === "usi") {
          usi += amount;
        }

        if (name.toLowerCase() === "enz") {
          enz += amount;
        }

        const div = document.createElement("div");

        div.className = "expense";

        div.innerHTML = `
          <div class="expense-top">
            <div class="expense-description">
              ${escapeHtml(expense.description || "Spesa")}
            </div>

            <div class="expense-amount">
              € ${amount.toFixed(2)}
            </div>
          </div>

          <div class="expense-info">
            Pagata da ${escapeHtml(name)}
            · ${escapeHtml(expense.expense_date)}
          </div>
        `;

        list.appendChild(div);
      });
    }

    document.getElementById("total").textContent =
      formatEuro(total);

    document.getElementById("usiTotal").textContent =
      formatEuro(usi);

    document.getElementById("enzTotal").textContent =
      formatEuro(enz);

    document.getElementById("balance").textContent =
      formatEuro(usi - enz);
  }

  async function addExpense() {

    const description =
      document.getElementById("description").value.trim();

    const amount =
      Number(document.getElementById("amount").value);

    const paidBy =
      document.getElementById("paidBy").value;

    const errorBox =
      document.getElementById("expenseError");

    errorBox.textContent = "";

    if (!description) {
      errorBox.textContent = "Inserisci una descrizione.";
      return;
    }

    if (!amount || amount <= 0) {
      errorBox.textContent = "Inserisci un importo valido.";
      return;
    }

    if (!paidBy) {
      errorBox.textContent = "Seleziona chi ha pagato.";
      return;
    }

    const { error } = await supabaseClient
      .from("expenses")
      .insert({
        household_id: HOUSEHOLD_ID,
        paid_by: paidBy,
        category_id: null,
        amount: amount,
        description: description,
        expense_date: new Date().toISOString().split("T")[0]
      });

    if (error) {
      console.error(error);
      errorBox.textContent =
        "Errore nel salvataggio: " + error.message;
      return;
    }

    document.getElementById("description").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("paidBy").value = "";

    await loadExpenses();
  }

  function formatEuro(value) {
    return new Intl.NumberFormat("it-IT", {
      style: "currency",
      currency: "EUR"
    }).format(value);
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  startApp();
</script>

</body>
</html>
